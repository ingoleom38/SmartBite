{% extends "auth/base.html" %}
{% block title %}Reset password — SmartBite{% endblock %}
{% block form_content %}
<h1>Set a new password</h1>
<p class="sub">Choose something you haven't used before.</p>
<form method="POST" action="{{ url_for('reset_password') }}">
  <div class="field">
    <label for="password">New password</label>
    <input id="password" type="password" name="password" minlength="6" required autofocus>
  </div>
  <div class="field">
    <label for="confirm_password">Confirm new password</label>
    <input id="confirm_password" type="password" name="confirm_password" minlength="6" required>
  </div>
  <button class="btn btn-primary btn-block" type="submit">Reset password</button>
</form>
{% endblock %}
