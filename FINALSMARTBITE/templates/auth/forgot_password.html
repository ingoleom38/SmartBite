{% extends "auth/base.html" %}
{% block title %}Forgot password — SmartBite{% endblock %}
{% block form_content %}
<a class="auth-back" href="{{ url_for('login') }}">&larr; Back to login</a>
<h1>Forgot your password?</h1>
<p class="sub">Enter your account email, we'll send a 6-digit OTP to reset it.</p>
<form method="POST" action="{{ url_for('forgot_password') }}">
  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" required autofocus>
  </div>
  <button class="btn btn-primary btn-block" type="submit">Send OTP</button>
</form>
{% endblock %}
